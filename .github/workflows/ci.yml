name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: macos-latest
            compiler: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zlib development headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Compile with strict warnings
        run: make CXX=${{ matrix.compiler }}

      - name: Run C++17 unit & integration tests
        run: make CXX=${{ matrix.compiler }} unit-test

      - name: Run end-to-end CLI test suite
        run: make CXX=${{ matrix.compiler }} e2e-test

      - name: Verify walkthrough script
        run: bash scripts/demo.sh
